<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spring Guy — RIVE Works</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #121212; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100svh; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .back { position: fixed; z-index: 2; top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); padding: 10px 15px; border: 1px solid #ffffff32; border-radius: 999px; background: #0009; color: #fff; text-decoration: none; font-size: 14px; backdrop-filter: blur(10px); }
    .back:hover, .back:focus-visible { background: #000c; outline: 2px solid #fff; outline-offset: 2px; }
    #status { position: fixed; z-index: 1; left: 16px; bottom: 16px; margin: 0; padding: 8px 12px; border-radius: 999px; background: #0009; color: #ddd; font-size: 13px; pointer-events: none; backdrop-filter: blur(8px); }
    #status[data-state="ok"] { color: #9ce6aa; }
    #status[data-state="error"] { color: #ff9b9b; }
  </style>
</head>
<body>
  <a class="back" href="./index.html" aria-label="返回作品目錄">← 作品目錄</a>
  <canvas id="rive-canvas" aria-label="Interactive Spring Guy animation"></canvas>
  <p id="status">正在載入互動作品…</p>
  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <script>
    const canvas = document.querySelector('#rive-canvas');
    const status = document.querySelector('#status');
    let instance;
    const setStatus = (message, state = '') => { status.textContent = message; status.dataset.state = state; };
    const resize = () => instance?.resizeDrawingSurfaceToCanvas();
    try {
      instance = new rive.Rive({
        src: './springguy.riv', canvas, stateMachines: 'State Machine 1',
        autoplay: true, autoBind: true, isTouchScrollEnabled: false, dispatchPointerExit: true,
        layout: new rive.Layout({ fit: rive.Fit.Contain, alignment: rive.Alignment.Center }),
        onLoad: () => { resize(); instance.setupRiveListeners({ isTouchScrollEnabled: false }); setStatus('互動已就緒：按住角色並拖曳。', 'ok'); },
        onLoadError: error => { console.error(error); setStatus('載入失敗，請確認 Rive 檔案位於同一層。', 'error'); }
      });
      const observer = new ResizeObserver(resize); observer.observe(canvas);
      window.addEventListener('beforeunload', () => { observer.disconnect(); instance?.cleanup(); });
    } catch (error) { console.error(error); setStatus('Rive Web runtime 無法啟動。', 'error'); }
  </script>
</body>
</html>
