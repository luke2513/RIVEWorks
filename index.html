<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Luke Chen 的 Rive 互動動態作品集">
  <title>RIVE Works — Interactive Motion</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #0a0a0a; color: #f7f7f4; }
    main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 64px; }
    header { margin-bottom: 52px; }
    .eyebrow { margin: 0 0 14px; color: #8e8e89; font-size: .82rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 780px; font-size: clamp(2.7rem, 7vw, 6.8rem); line-height: .92; letter-spacing: -.065em; }
    .intro { max-width: 520px; margin: 26px 0 0; color: #aaa9a2; font-size: 1rem; line-height: 1.65; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .card { display: block; min-height: 410px; padding: 30px; border: 1px solid #2a2a28; border-radius: 24px; color: inherit; text-decoration: none; overflow: hidden; transition: transform .25s ease, border-color .25s ease; }
    .card:hover, .card:focus-visible { transform: translateY(-5px); border-color: #696965; outline: none; }
    .card-top { display: flex; justify-content: space-between; gap: 20px; font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .arrow { font-size: 1.25rem; line-height: 1; transition: transform .25s ease; }
    .card:hover .arrow { transform: translate(4px, -4px); }
    .card-content { display: flex; height: 305px; flex-direction: column; justify-content: flex-end; }
    h2 { margin: 0 0 10px; font-size: clamp(2rem, 4vw, 3.6rem); line-height: .98; letter-spacing: -.045em; }
    .card p { margin: 0; color: #171717; font-size: .95rem; }
    .puppy { background: #3293b2; color: #0b2630; }
    .spring { background: #9064e5; color: #211338; }
    footer { margin-top: 44px; color: #696965; font-size: .8rem; }
    @media (max-width: 720px) {
      main { width: min(100% - 28px, 1120px); padding-top: 48px; }
      header { margin-bottom: 36px; }
      .grid { grid-template-columns: 1fr; }
      .card { min-height: 330px; }
      .card-content { height: 235px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Luke Chen · Rive Works</p>
      <h1>Interactive<br>Motion</h1>
      <p class="intro">選擇一個作品，直接使用滑鼠或觸控操作。</p>
    </header>
    <section class="grid" aria-label="Rive 作品目錄">
      <a class="card puppy" href="./puppy.html">
        <div class="card-top"><span>01 · Character Interaction</span><span class="arrow">↗</span></div>
        <div class="card-content">
          <h2>Puppy and<br>Annoying Fly</h2>
          <p>移動游標，和小狗與蒼蠅互動。</p>
        </div>
      </a>
      <a class="card spring" href="./springguy.html">
        <div class="card-top"><span>02 · Spring Interaction</span><span class="arrow">↗</span></div>
        <div class="card-content">
          <h2>Spring<br>Guy</h2>
          <p>按住角色，拉動並觀察彈簧回彈。</p>
        </div>
      </a>
    </section>
    <footer>Built with Rive · 2026</footer>
  </main>
</body>
</html>
