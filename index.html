<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spring Guy — Rive Demo</title>
  <style>
    :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #121212; }
    canvas {
      display: block;
      width: 100vw;
      height: 100svh;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    #status {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 1;
      margin: 0;
      padding: 8px 12px;
      border-radius: 999px;
      background: #0009;
      color: #ddd;
      font-size: 13px;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
    #status[data-state="ok"] { color: #9ce6aa; }
    #status[data-state="error"] { color: #ff9b9b; }
  </style>
</head>
<body>
  <canvas id="rive-canvas" aria-label="Interactive Spring Guy animation"></canvas>
  <p id="status">正在載入互動作品…</p>

  <script src="https://unpkg.com/@rive-app/webgl2"></script>
  <script>
    const FILE = './springguy.riv';
    const STATE_MACHINE = 'State Machine 1';

    const canvas = document.querySelector('#rive-canvas');
    const status = document.querySelector('#status');
    let riveInstance;

    function setStatus(message, state = '') {
      status.textContent = message;
      status.dataset.state = state;
    }

    function resize() {
      riveInstance?.resizeDrawingSurfaceToCanvas();
    }

    try {
      riveInstance = new rive.Rive({
        src: FILE,
        canvas,
        stateMachines: STATE_MACHINE,
        autoplay: true,
        autoBind: true,
        isTouchScrollEnabled: false,
        dispatchPointerExit: true,
        layout: new rive.Layout({
          fit: rive.Fit.Contain,
          alignment: rive.Alignment.Center,
        }),
        onLoad: () => {
          resize();
          riveInstance.setupRiveListeners({ isTouchScrollEnabled: false });
          setStatus('互動已就緒：移動、按下並拖曳。', 'ok');
        },
        onLoadError: (error) => {
          console.error('Rive load error:', error);
          setStatus('載入失敗，請確認 .riv 與 index.html 位於同一資料夾。', 'error');
        },
      });

      const observer = new ResizeObserver(resize);
      observer.observe(canvas);
      window.addEventListener('beforeunload', () => {
        observer.disconnect();
        riveInstance?.cleanup();
      });
    } catch (error) {
      console.error(error);
      setStatus('Rive Web runtime 無法啟動，請檢查網路後重新整理。', 'error');
    }
  </script>
</body>
</html>
